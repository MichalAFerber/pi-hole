name: Build unified hosts

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  # The generator opens a pull request instead of pushing to main.
  pull-requests: write
  # Releasing our own held check run — see the last step.
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Generate unified hosts
        run: |
          ./scripts/generate-unified-hosts.sh

      - name: Open a pull request if the list changed
        # main is PR-only (ruleset, since 2026-07-28), so `git push HEAD:main`
        # is rejected — it had been failing silently since, because this job
        # last ran in December. The generated list now arrives the same way
        # every other change does, and the ci gate validates it on the way in.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git status --porcelain hosts/unified-hosts.txt | grep -q .; then
            echo "No changes in hosts/unified-hosts.txt - nothing to do."
            exit 0
          fi
          # The file carries a `# generated:` header that changes on every run.
          # Left alone, merging a pull request re-triggers this job, which
          # restamps the header, which opens another pull request — forever. The
          # old direct-push flow escaped that with [skip ci]; a pull request has
          # no such brake, so the emptiness test has to ignore the volatile line.
          substantive=$(git diff -U0 -- hosts/unified-hosts.txt \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -vE '^[+-]# generated:' || true)
          if [ -z "$substantive" ]; then
            echo "Only the generated-at timestamp changed - nothing worth a pull request."
            git checkout -- hosts/unified-hosts.txt
            exit 0
          fi
          echo "Changes detected in hosts/unified-hosts.txt."
          BRANCH="bot/unified-hosts-$(date +'%Y%m%d-%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add hosts/unified-hosts.txt
          git commit -m "chore: update unified-hosts.txt"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update unified-hosts.txt" \
            --body "Generated by \`build-hosts.yml\`. The \`ci\` gate re-runs the generator and checks the list has not collapsed."

          # GitHub holds workflow runs on bot-authored pull requests, so `ci` sits
          # at action_required and the PR waits on a check that will never start.
          # Release our own run rather than leaving a click behind. If the token
          # is not permitted to, say so and carry on — the PR is still open and a
          # human can approve it; that is friction, not breakage.
          for i in 1 2 3 4 5 6; do
            run=$(gh run list --branch "$BRANCH" --workflow ci.yml \
                    --json databaseId,status --jq '[.[]|select(.status=="action_required")][0].databaseId')
            if [ -n "$run" ] && [ "$run" != "null" ]; then
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$run/approve" >/dev/null 2>&1; then
                echo "released held ci run $run"
              else
                echo "::warning::could not release run $run — approve it by hand to merge"
              fi
              exit 0
            fi
            sleep 5
          done
          echo "::warning::no held ci run appeared for $BRANCH; check the pull request"

      - name: Tag release if hosts changed (optional)
        # Tagging moved to the merge of the bot's pull request; tagging here
        # would name a commit that is not on main yet.
        if: false
        run: echo "superseded by the pull-request flow"
